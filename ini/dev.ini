; =============================================================================
;  phprt 预设：dev（本地开发、调试用）
;    - 所有错误都显示出来
;    - opcache 关掉，改代码不用重启 opcache
;    - 内存放宽一点，方便跑 Composer / 框架
; =============================================================================
[PHP]
date.timezone = Asia/Shanghai
memory_limit = 256M
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
error_log = ""
max_execution_time = 0
default_charset = "UTF-8"
assert.active = 1
zend.assertions = 1

[opcache]
opcache.enable = 0
opcache.enable_cli = 0

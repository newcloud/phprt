; =============================================================================
;  phprt 内置默认 php.ini（= 安装时生成的那份的等价版本）
;
;  不要在这里写 extension_dir：由 myphp / myapp.sh 在命令行上用 -d 给出，
;  这样整个安装根搬走以后还能用。扩展的加载在 <安装根>/php-<版本>/etc/conf.d/。
; =============================================================================
[PHP]
date.timezone = Asia/Shanghai
memory_limit = 256M
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
max_execution_time = 0
default_charset = "UTF-8"

[opcache]
opcache.enable = 1
opcache.enable_cli = 1

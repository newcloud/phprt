# 项目配置，放在项目根（--root 指向的目录）。

# ---------- 两种模式共用 ----------
# recipe 目录。留空用 ./recipes；相对路径按项目根解析。
# 命令行 --recipes 优先于这里。
recipes = ""

# 下载缓存目录，命令行 --download-dir 优先。
# 留空时：本地用 local_internal_dir/downloads，全局用 ~/phprtdownloads。
# 可绝对或相对（本地相对项目根，全局相对 $HOME）。
download_dir = "/home/z/testphp/downloads"

# ---------- 本地模式（默认，不加 --global）----------
# 下面三个只在本地模式使用，都相对项目根（--root）。
# 工具目录：状态、安装树、下载缓存、备份。
# 留空用 .phprt；也可以写绝对路径（如 /opt/php）。
# 例：项目根 /www/blog → 空是 /www/blog/.phprt，"data" 是 /www/blog/data。
local_internal_dir = ""

# 源码解压目录；留空用 build。 例如 local_build_dir = "" => /www/blog/build ; local_build_dir = ".phprt/build" => /www/blog/.phprt/build
local_build_dir = ""

# 组件 ini 的备份目录；留空用 local_internal_dir/backup（即 .phprt/backup）。
local_backup_dir = ""

# ---------- 全局模式（--global --prefix <安装目录>）----------
# 下面两个只在 --global 时使用；相对路径按 $HOME 解析，也可以写绝对路径。
# 默认分别是 ~/phprtbuild、~/phprtbackup。
global_build_dir = ""
global_backup_dir = ""

# ---------- 编译 ----------
# 编译并发数，作为 make -j / cmake 的并行度。
# 注释掉时用 CPU 数 - 1（最少 1）；数字必须 >= 1。命令行 --parallel 优先。
# parallel = 8

# ---------- catalog 在线检查 ----------
# install / update / add / remove 在真正下载或编译前是否询问获取最新补丁。
# false = 不问、不取，直接用本地；default_answer 只能是 y / n。
# [catalog]
# ask_before_online_update = true
# default_answer = "y"

# GitHub 直连失败后是否改用镜像下载：enable / disable
enable_github_proxy_download = "enable"

# 镜像前缀，按顺序尝试，只对 https://github.com/ 生效。
proxy_urls = [
    "https://gh-proxy.com/",
    "https://ghfast.top/",
    "https://ghproxy.net/",
    "https://gh.llkk.cc/",
]

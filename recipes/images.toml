# 容器镜像 catalog、镜像家族与包名映射。
# [images.*] 登记验证过的镜像线；[families.*] 按镜像内容套用必要的环境设置；
# [package_maps.*] 供宿主安装提示和容器自动装包共用（docs/HOST-COMMANDS.md §3）。

# ---- 镜像线 ----
# 只登记验证过的镜像：digest 必填，tag 会漂。gcc 写 major.minor，glibc 用于
# 显示运行下限，不参与构建判断。

[images.fedora43]
image  = "quay.io/fedora/fedora:43"
digest = "sha256:40e048329e89502dae22f4f35d44aaca50bffb611e5c0c9d50bbbe7a5092db9b"
pm     = "dnf"
gcc    = "15.3"
glibc  = "2.42"

[images.debian13]
# 国内可换成 docker.m.daocloud.io/library/debian:13，digest 相同。
image  = "docker.io/library/debian:13"
digest = "sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6"
pm     = "apt"
gcc    = "14.2"
glibc  = "2.41"
# 派生容器要额外装的包。容器里装一次就留在容器里，下次 add / remove / update 直接
# 复用这个容器，不重装。
#
# Debian/Ubuntu 的 perl-base 提供 /usr/bin/perl 却缺 FindBin，openssl 的 Configure
# 会挂。宿主模式靠 feature_check（recipes/tools/perl.star 的 findbin）提前发现，
# 按 need_packages(["perl"], reason = "...") 提示装完整 perl；这里保证容器里
# 一次性装好。
# 包名直接追加到推导清单后面（不走 [package_maps.*]，写发行版真包名）：
#   apt-get update && apt-get install -y --no-install-recommends ... perl
packages = ["perl"]

# 容器环境前置：创建容器后、自动装包和编译之前，以 root 在容器里按顺序执行一次。
#
# 只对这个镜像条目生效；宿主模式没有这一步（宿主仍然只提示、不执行），
# plan 只把命令列出来不执行，--offline 不跑。某条命令非 0 退出就删掉容器并中止，
# 不会带病继续装包或编译。改包源、加 GPG key 这类"必须在装包前完成"的动作写这里。
# bootstrap = [
#   "sed -i 's|deb.debian.org|mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list.d/debian.sources",
# ]

[images.ubuntu2604]
# 国内可换 docker.m.daocloud.io/library/ubuntu:26.04：内容相同（同一 config），
# 镜像站会重写 index 的 digest，所以这里写官方 digest。
image  = "docker.io/library/ubuntu:26.04"
digest = "sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db"
pm     = "apt"
gcc    = "15.2"
glibc  = "2.43"
# 同 debian13：perl-base 有 /usr/bin/perl 却缺 FindBin，openssl 编译要完整 perl。
packages = ["perl"]

# ---- 镜像家族 ----
# 按镜像内容（包管理器 + /etc/os-release 的 ID / ID_LIKE）匹配，不按引用或
# digest 匹配：镜像站会换前缀，tag 和 digest 也会漂。
#
# 命中的家族设置会在创建实例后写进实例 rootfs；有设置就必须写 reason，
# 让配置本身说明为什么需要它。id_like 为空表示只按包管理器匹配。

[families.debian]
pm = "apt"
id_like = ["debian", "ubuntu"]
reason = """
rootless 用户命名空间只映射了 uid/gid 0，libcontainer 还会写 setgroups=deny。
apt 默认降权到 _apt(42) / nogroup(65534) 做下载沙箱，这两个 id 在命名空间里
没有映射，setgroups / setegid / seteuid 全部失败，apt-get update 直接报错退出。
把 APT::Sandbox::User 设成 root 后 apt 不再降权，下载和装包才能进行；
容器本身仍是 rootless，命令只在用户命名空间内以 uid 0 运行。
"""
apt_sandbox = "root"

# ---- 包名映射 ----
# 命令名 -> 发行版包名，按包管理器分组。
# 宿主安装提示和镜像自动安装共用；没写的名字不安装，只提示用户自行确认。

[package_maps.apt]
gcc        = "gcc"
"g++"      = "g++"
cc         = "gcc"
"c++"      = "g++"
clang      = "clang"
"clang++"  = "clang"
make       = "make"
ar         = "binutils"
ranlib     = "binutils"
ld         = "binutils"
pkg-config = "pkg-config"
patchelf   = "patchelf"
perl       = "perl"
m4         = "m4"
sh         = "bash"
cmake      = "cmake"
nasm       = "nasm"
autoconf   = "autoconf"

[package_maps.dnf]
gcc        = "gcc"
"g++"      = "gcc-c++"
cc         = "gcc"
"c++"      = "gcc-c++"
clang      = "clang"
"clang++"  = "clang"
make       = "make"
ar         = "binutils"
ranlib     = "binutils"
ld         = "binutils"
pkg-config = "pkgconf"
patchelf   = "patchelf"
perl       = "perl"
m4         = "m4"
sh         = "bash"
cmake      = "cmake"
nasm       = "nasm"
autoconf   = "autoconf"

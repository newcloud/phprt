# phprt 版本数据库（测试用）
#
# 每条线是一个数组，保存这条线发布过的所有补丁（version / url / sha256）。
# 默认选择取数组中版本最大的补丁，和数组顺序无关；
# `--lock` 和 `install php@8.4.13` 这类显式补丁按版本精确查找。
# 兼容性（哪条线支持哪个产品、依赖哪些库）写在 recipe 的 LINES / PRODUCT_LINES 里。
#
# 更新时在对应线的数组里加新补丁；旧补丁保留，不删除。


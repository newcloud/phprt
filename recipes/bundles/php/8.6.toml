# 只写默认版本线，不写补丁号；顶层是扩展，[deps] 是依赖库。
product = "php"
# PHP 8.6 删除了 XtOffsetOf / zval_dtor 等 Zend API。swoole 6.3.0、xdebug 3.5.3
# 仍未支持 8.6；PECL 里目前只有 ssh2 1.6.1 实测可编（redis 6.4.0RC1 也可编，
# 等稳定版）。其余扩展的现有版本线都编不过，等上游发支持 8.6 的版本再加回。
ssh2 = "1.6"

[deps]
openssl = "3.5"
libcurl = "8.23"
libxml2 = "2.15"
zlib = "1.3"
libpng = "1.6"
jpeg = "3.1"
webp = "1.6"
aom = "3.12"
avif = "1.3"
freetype = "2.13"
libffi = "3.8"

# 默认构建目标；由 --targets 覆盖。
[targets]
default = ["cli"]

# 扩展被选中时的默认 feature / 依赖功能；不决定是否默认安装。
# --ext 名字 或 ext add 名字 时使用这里的配置。
[component_presets]
openssl = { features = ["argon2"] }
curl = { deps = { libcurl = ["ssl"] } }
gd = { features = ["jpeg", "webp", "freetype"] }
zip = { deps = { libzip = ["encryption"] } }
sqlite3 = { deps = { sqlite = ["column_metadata"] } }
pdo_sqlite = { deps = { sqlite = ["column_metadata"] } }

# 默认启用的扩展。
#
# features 是扩展自己的编译开关；deps 按依赖名列出要转给它的 feature。
# 需要某个依赖的功能时，deps 必须和扩展一起写；示例见上方 [component_presets].curl。
# 不写代码做依赖推导，漏写时 PHP configure 会报错。
#
# 默认项用 ref 引用 [component_presets]；ref 只接受
# "component_presets.<同名扩展>"，不能和 features/deps 同时写。
#
# 这张表必须放在文件最后：TOML 里表头之后的裸键都属于这个表。
[default_components]
openssl = { ref = "component_presets.openssl" }
curl = { ref = "component_presets.curl" }
libxml = {}
zlib = {}
sqlite3 = { ref = "component_presets.sqlite3" }
pdo_sqlite = { ref = "component_presets.pdo_sqlite" }
mysqli = {}
pdo_mysql = {}
mbstring = {}
zip = { ref = "component_presets.zip" }
sodium = {}
gettext = {}
pcntl = {}
sockets = {}
shmop = {}
sysvmsg = {}
sysvsem = {}
sysvshm = {}

# FFI 默认 shared：独立 ffi.so + 20-ffi.ini，不静态编进 bin/php。
ffi = { mode = "shared" }

# =============================================================================
#  phprt 构建配置（仓库里这份是模板；install.sh 会把它和 lib/versions/ 里
#  选中的 PHP 版本合并成 <安装根>/config.conf，之后改配置改安装根那份）
#
#  下载包：<安装根>/downloads/<文件名>，文件名就是 URL 最后一段。
#    想完全离线：把包放进 仓库/downloads/ 再跑 install.sh，会硬链过去。
#    例：https://www.php.net/distributions/php-8.5.12.tar.xz
#        -> php-8.5.12.tar.xz
#
#  网络：先直连；直连失败自动走代理 http://127.0.0.1:10808
#        （已 export https_proxy 时 curl 会优先用你的；PHPRT_PROXY= 可改）
#
#  sha256：留空则首次下载后记录到 <安装根>/downloads/SHA256SUMS，
#          之后按该记录校验（TOFU）；填了则强制按你给的值校验
# =============================================================================

# ------------------------------- 开关 ----------------------------------------
# 1 = 编译该依赖并让 PHP 链接它；0 = 跳过
# 现在是「常用档」：openssl / zlib / libxml2 / sqlite / curl / mbstring / zip / redis / composer
ENABLE_OPENSSL=1        # TLS：PHP openssl 扩展、curl https、Composer 都依赖
ENABLE_ZLIB=1           # gz 函数、压缩 phar；libxml2/curl/libzip 也用它
ENABLE_LIBCURL=1        # PHP curl 扩展（依赖 openssl + zlib）
ENABLE_SQLITE=1         # sqlite3 / pdo_sqlite
ENABLE_LIBXML2=1        # dom / xml / simplexml / soap
ENABLE_ONIGURUMA=1      # mbstring 的 mbregex（关掉就没有 mbstring）
ENABLE_ICU=1            # intl 的依赖（ICU 是 C++ 项目，需要 g++；编译最久）
ENABLE_LIBZIP=1         # PHP zip 扩展（Composer 解包用）
ENABLE_REDIS=1          # redis 扩展（PECL 源码 + phpize）
ENABLE_COMPOSER=1       # Composer phar（需要 ENABLE_OPENSSL=1）
ENABLE_MYSQLI=1         # mysqli / pdo_mysql（用内置 mysqlnd，不需要外部库）
ENABLE_INTL=1           # intl（需要 ENABLE_ICU=1）
ENABLE_GD=1             # gd：png / jpeg / freetype（需要 ENABLE_ZLIB=1）
ENABLE_WEBP=1           # gd 的 WebP 支持（libwebp）
ENABLE_AVIF=1           # gd 的 AVIF 支持（libavif + libaom；编译较慢）
ENABLE_FFI=1            # FFI（需要 libffi）
ENABLE_YAML=1           # yaml 扩展（PECL + libyaml）
ENABLE_APCU=1           # apcu 扩展（PECL，常驻进程里当本地缓存用）
ENABLE_XDEBUG=1         # xdebug 扩展（PECL；默认 xdebug.mode=off，不拖慢运行）
ENABLE_SWOOLE=1         # swoole 扩展（PECL；C++ 项目，需要 g++）

# 依赖关系（脚本不会自动帮你打开，写了 1 就得保证被依赖的也是 1）：
#   ENABLE_LIBCURL  需要 ENABLE_OPENSSL（否则 curl 没有 https）、ENABLE_ZLIB
#   ENABLE_LIBZIP   需要 ENABLE_ZLIB
#   ENABLE_COMPOSER 需要 ENABLE_OPENSSL（https 下载），建议同时开 ENABLE_LIBZIP
#   ENABLE_REDIS    需要 PHP 本体，编译时会自动装 autoconf（放在 tools/）
# 编译顺序由 build.sh 固定：openssl → zlib → libxml2 → sqlite → curl
#                          → oniguruma → libzip → php → redis → composer

# --------------------------- 依赖版本与下载地址 ------------------------------
# PHP 本身的版本/地址不在这里，见 lib/versions/php-<版本>.conf

# OpenSSL：3.5.9 为 LTS；最新稳定为 4.1.0（PHP 8.5 建议先用 3.5 LTS）
OPENSSL_VERSION=3.5.9
OPENSSL_URL="https://www.openssl.org/source/openssl-3.5.9.tar.gz"   # 官方源站，可直连（GitHub release 需代理）
OPENSSL_SHA256=""

ZLIB_VERSION=1.3.2
ZLIB_URL="https://zlib.net/zlib-1.3.2.tar.gz"
ZLIB_SHA256=""

LIBCURL_VERSION=8.23.0
LIBCURL_URL="https://curl.se/download/curl-8.23.0.tar.xz"
LIBCURL_SHA256=""

SQLITE_VERSION=3.54.1
SQLITE_URL="https://sqlite.org/2026/sqlite-amalgamation-3540100.zip"
SQLITE_SHA256=""

LIBXML2_VERSION=2.15.4
LIBXML2_URL="https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz"
LIBXML2_SHA256=""

# oniguruma 的 tag 是 v6.9.10，压缩包名字是 onig-6.9.10.tar.gz
ONIGURUMA_VERSION=6.9.10
ONIGURUMA_URL="https://github.com/kkos/oniguruma/releases/download/v6.9.10/onig-6.9.10.tar.gz"
ONIGURUMA_SHA256=""

# ICU：GitHub release 的 sources 包（tag 是 release-79.1，注意是点）
ICU_VERSION=79.1
ICU_URL="https://github.com/unicode-org/icu/releases/download/release-79.1/icu4c-79.1-sources.tgz"
ICU_SHA256=""

LIBZIP_VERSION=1.12.1
LIBZIP_URL="https://libzip.org/download/libzip-1.12.1.tar.xz"
LIBZIP_SHA256=""

# gd 的三个依赖（libpng 依赖 zlib，freetype 依赖 zlib+libpng）
LIBPNG_VERSION=1.6.50
LIBPNG_URL="https://download.sourceforge.net/libpng/libpng-1.6.50.tar.xz"
LIBPNG_SHA256=""

# libjpeg-turbo 用 cmake 构建（没有 nasm 时要关掉 SIMD）
JPEG_VERSION=3.1.2
JPEG_URL="https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.1.2/libjpeg-turbo-3.1.2.tar.gz"
JPEG_SHA256=""

WEBP_VERSION=1.6.0
WEBP_URL="https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.6.0.tar.gz"
WEBP_SHA256=""

# AVIF：libavif 靠 libaom（AV1 编解码器）
AOM_VERSION=3.12.0
AOM_URL="https://storage.googleapis.com/aom-releases/libaom-3.12.0.tar.gz"
AOM_SHA256=""

AVIF_VERSION=1.3.0
AVIF_URL="https://github.com/AOMediaCodec/libavif/archive/refs/tags/v1.3.0.tar.gz"
AVIF_SHA256=""

FREETYPE_VERSION=2.13.3
FREETYPE_URL="https://download.savannah.gnu.org/releases/freetype/freetype-2.13.3.tar.xz"
FREETYPE_SHA256=""

# FFI
LIBFFI_VERSION=3.4.8
LIBFFI_URL="https://github.com/libffi/libffi/releases/download/v3.4.8/libffi-3.4.8.tar.gz"
LIBFFI_SHA256=""

# yaml 扩展的依赖
LIBYAML_VERSION=0.2.5
LIBYAML_URL="https://pyyaml.org/download/libyaml/yaml-0.2.5.tar.gz"
LIBYAML_SHA256=""

# PECL 扩展
XDEBUG_VERSION=3.5.3
XDEBUG_URL="https://pecl.php.net/get/xdebug-3.5.3.tgz"
XDEBUG_SHA256=""

APCU_VERSION=5.1.28
APCU_URL="https://pecl.php.net/get/apcu-5.1.28.tgz"
APCU_SHA256=""

YAML_EXT_VERSION=2.3.0
YAML_EXT_URL="https://pecl.php.net/get/yaml-2.3.0.tgz"
YAML_EXT_SHA256=""

# swoole（C++，编译时会给每个 PHP 版本单独编一份）
SWOOLE_VERSION=6.2.4
SWOOLE_URL="https://pecl.php.net/get/swoole-6.2.4.tgz"
SWOOLE_SHA256=""

# ---------------------------------------------------------------------------
# 以下三项一般不用改
# ---------------------------------------------------------------------------

# redis 扩展（PECL 版本号；编译需要 autoconf，会自动装到 tools/）
REDIS_VERSION=6.3.0
REDIS_URL="https://pecl.php.net/get/redis-6.3.0.tgz"
REDIS_SHA256=""

# autoconf：只在编译 redis 这类 PECL 扩展时用，装进 tools/，不污染系统
AUTOCONF_VERSION=2.72
AUTOCONF_URL="https://ftp.gnu.org/gnu/autoconf/autoconf-2.72.tar.xz"
AUTOCONF_SHA256=""

# Composer：latest-stable 自动跟最新稳定版；想锁版本就写 2.8.4 这样的版本号
COMPOSER_VERSION=latest-stable
COMPOSER_URL="https://getcomposer.org/download/latest-stable/composer.phar"

# perl 源码包（只在系统缺 perl-core 时用来补齐纯 perl 模块，不编译 perl）
PERL_SHIM_VERSION=5.42.2
PERL_SHIM_URL="https://www.cpan.org/src/5.0/perl-5.42.2.tar.xz"
PERL_SHIM_SHA256=""

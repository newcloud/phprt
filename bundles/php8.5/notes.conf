# recipe 的语义坑。recipe 头部用 note=slug+slug 引用，一行一个 slug=text。
posix-default-on=POSIX 上游默认启用；关闭时必须显式 --disable-posix
phpize-libedit=ext/readline 用 PHP_ARG_WITH；phpize 会强制 libedit，只能 static
ncurses-widec=ncurses 默认 widec，只产出 libncursesw.so；PHP 只认 libncurses
ncurses-cxx=ncurses 的 C++ 绑定在 GCC 15 下编不过，需要 --without-cxx --without-cxx-binding
readline-termcap=readline 的 .so 默认不链 termcap（SHLIB_LIBS 空），需要 --with-shared-termcap-library

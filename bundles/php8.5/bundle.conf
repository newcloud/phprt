# phprtv2 —— recipe v2 最小验证 bundle（只保留 8.5 + 4 个扩展）
#
# 这里只放全局策略和版本 pin：扩展清单由 bundles/php8.5/{builtin,ext}/*.sh 决定，
# 不再维护 SUPPORTED_EXTS。

PHP_VERSION=8.5.12
PHP_ARCHIVE=php-8.5.12.tar.xz
PHP_URL="https://www.php.net/distributions/php-8.5.12.tar.xz"
# 在线检查用：php.net 的 8.5 系列
PHP_UPSTREAM="phpnet:8.5"
PHP_SHA256="08bc2eba2a588654ade1357174aa646b761556c862dda0678345ee29ed481209"
PHP_SRC_DIR=php-8.5.12
NEEDS_BUILDCONF=0

# 默认编译这四个；新增扩展只要加 recipe 文件，就会出现在可选清单里
DEFAULT_EXTS="openssl curl zip swoole"

LTO_PHP=0
PHP_CFLAGS="-O2"
PHP_CXXFLAGS="-O2"

# --------------------------- 依赖版本与下载地址 ------------------------------

OPENSSL_VERSION=3.5.9
OPENSSL_URL="https://www.openssl.org/source/openssl-3.5.9.tar.gz"
OPENSSL_SHA256=""

ZLIB_VERSION=1.3.2
ZLIB_URL="https://zlib.net/zlib-1.3.2.tar.gz"
ZLIB_SHA256=""

LIBCURL_VERSION=8.23.0
LIBCURL_URL="https://curl.se/download/curl-8.23.0.tar.xz"
LIBCURL_SHA256=""

LIBZIP_VERSION=1.12.1
LIBZIP_URL="https://libzip.org/download/libzip-1.12.1.tar.xz"
LIBZIP_SHA256=""

# --------------------------- PECL 扩展 ---------------------------------------

SWOOLE_VERSION=6.2.4
SWOOLE_URL="https://pecl.php.net/get/swoole-6.2.4.tgz"
SWOOLE_SHA256=""

# --------------------------- 构建工具 ----------------------------------------

AUTOCONF_VERSION=2.72
AUTOCONF_URL="https://ftp.gnu.org/gnu/autoconf/autoconf-2.72.tar.xz"
AUTOCONF_SHA256=""

PERL_SHIM_VERSION=5.42.2
PERL_SHIM_URL="https://www.cpan.org/src/5.0/perl-5.42.2.tar.xz"
PERL_SHIM_SHA256=""

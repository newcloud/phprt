PHP_VERSION=8.5.12
PHP_ARCHIVE=php-8.5.12.tar.xz
PHP_URL="https://www.php.net/distributions/php-8.5.12.tar.xz"
PHP_SHA256="08bc2eba2a588654ade1357174aa646b761556c862dda0678345ee29ed481209"
PHP_SRC_DIR=php-8.5.12
NEEDS_BUILDCONF=0
DEFAULT_EXTS="openssl zlib libxml2 curl sqlite mysqli mbstring zip"
SUPPORTED_EXTS="openssl zlib libxml2 curl sqlite mysqli mbstring intl zip gd ffi redis protobuf xdebug apcu yaml swoole"
# =============================================================================
#  phprt 构建配置（仓库里这份是模板；install.sh 会把它和 lib/versions/ 里
#  选中的 PHP 版本合并成 <安装根>/configs/php-<版本>.conf，之后改配置改安装根那份）
#
#  下载包：<安装根>/downloads/<文件名>，文件名就是 URL 最后一段。
#    想完全离线：把包放进 仓库/downloads/ 再跑 install.sh，会硬链过去。
#    例：https://www.php.net/distributions/php-8.5.12.tar.xz
#        -> php-8.5.12.tar.xz
#
#  网络：先直连；直连失败自动走代理 http://127.0.0.1:10808
#        （已 export https_proxy 时 curl 会优先用你的；PHPRT_PROXY= 可改）
#
#  sha256：留空则首次下载后记录到 <安装根>/downloads/SHA256SUMS，
#          之后按该记录校验（TOFU）；填了则强制按你给的值校验
# =============================================================================

# ------------------------------- 开关 ----------------------------------------
# 1 = 编译该依赖并让 PHP 链接它；0 = 跳过
# 每个开关都由一个文件认领（右列），依赖也写在那份文件里 —— 不用翻 php.sh

# 依赖关系：分三种，别混
#   可选依赖（关掉只是少个功能，构建时只提醒）：
#     ENABLE_LIBCURL→OPENSSL/ZLIB（没有 https / deflate）、
#     ENABLE_LIBZIP→OPENSSL/ZLIB（zip AES 加密；openssl 已登记为硬依赖）、
#     ENABLE_COMPOSER→OPENSSL
#   内置扩展（不需要单独源码包，由 PHP 本体编译）：lib/modules/builtin/<扩展>.sh
#     文件里写开关、正负向 configure 参数和依赖；php.sh 只负责按顺序收集
#   硬依赖（没它编不出来）：登记在文件头部 `#  phprt: needs=` / `--needs`，
#     缺了会自动构建，不需要在这里再加一遍。例：
#       lib/modules/builtin/intl.sh  --needs -> icu
#       lib/modules/ext/swoole.sh    needs=openssl,zlib
#       lib/modules/deps/libpng.sh   needs=zlib
#   构建工具（autoconf / re2c / perl 核心模块）：由用到的模块自动拉起，装在 tools/
# 编译顺序由 build.sh 固定：库 → PHP 本体 → 扩展 → phar
#   openssl zlib libxml2 sqlite curl oniguruma libzip icu libpng jpeg freetype
#   webp aom avif libffi libyaml → php → redis protobuf xdebug apcu yaml swoole → composer

# --------------------------- 依赖版本与下载地址 ------------------------------
# PHP 本身的版本/地址不在这里，见 lib/versions/php-<版本>.conf

# OpenSSL：3.5.9 为 LTS；最新稳定为 4.1.0（PHP 8.5 建议先用 3.5 LTS）
